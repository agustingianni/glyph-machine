<!doctype html>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(900px 620px at 50% -10%, #1c1236, #05060c 62%) no-repeat,
      #05060c;
  }
  @font-face {
    font-family: F;
    src: url(../fonts/CubeSpin.woff2) format("woff2");
  }
  @keyframes d {
    from { font-variation-settings: "SPIN" 0; }
    to { font-variation-settings: "SPIN" 360; }
  }
  .s {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: F;
    color: #fff;
    font-size: 40vmin;
    line-height: 1;
  }
  .s > div { overflow: hidden; }
  .s span {
    display: inline-block;
    font-variation-settings: "SPIN" 0;
    animation: d 5s linear infinite;
  }
</style>
<div class="s"><div><span style="animation-delay: 0s">3</span><span style="animation-delay: -0.12s">D</span><span style="animation-delay: -0.24s">#</span></div></div>
